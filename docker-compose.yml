services:
  telemax:
    build:
      context: .
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
        # full (default) = animated stickers play as video (needs Chromium+ffmpeg, ~1.4 GB extra).
        # slim = animated stickers relay as a static image; much smaller/faster image. Set by setup.sh.
        STICKERS: ${STICKERS:-full}
    restart: unless-stopped
    # Hard cap on container stdout: the default json-file driver grows without
    # limit between container recreations. 10m x 3 bounds it at ~30 MB total;
    # relay tracing is INFO-level and proportional to actual message traffic,
    # so this ceiling is effectively unreachable in normal use anyway.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    env_file:
      - .env
    volumes:
      - ./data:/app/.data
